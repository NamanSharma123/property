name: frontend CI/CD
on:
  pull_request:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/frontend-deploy.yml', '.github/workflows/container-deploy.yml', 'ops/**', '.github/ec2_known_hosts']
  push:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/frontend-deploy.yml', '.github/workflows/container-deploy.yml', 'ops/**', '.github/ec2_known_hosts']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run type-check
        working-directory: frontend
      - run: npm run build
        if: github.event_name == 'pull_request'
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
  deploy:
    if: github.event_name != 'pull_request'
    needs: check
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/container-deploy.yml
    with:
      service: frontend
      context: frontend
    secrets: inherit
