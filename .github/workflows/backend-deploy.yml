name: backend CI/CD
on:
  pull_request:
    branches: [main]
    paths: ['backend-django/**', '.github/workflows/backend-deploy.yml', '.github/workflows/container-deploy.yml', 'ops/**', '.github/ec2_known_hosts']
  push:
    branches: [main]
    paths: ['backend-django/**', '.github/workflows/backend-deploy.yml', '.github/workflows/container-deploy.yml', 'ops/**', '.github/ec2_known_hosts']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend-django/requirements/*.txt
      - run: pip install -r backend-django/requirements/dev.txt
      - run: python manage.py check
        working-directory: backend-django
        env:
          DJANGO_SETTINGS_MODULE: config.settings.dev
          DJANGO_SECRET_KEY: ci-placeholder
      - run: docker build -t properly-backend:ci backend-django
        if: github.event_name == 'pull_request'
  deploy:
    if: github.event_name != 'pull_request'
    needs: check
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/container-deploy.yml
    with:
      service: backend
      context: backend-django
    secrets: inherit
