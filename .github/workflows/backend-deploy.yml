name: Backend CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'backend-django/**'
      - '.github/workflows/backend-deploy.yml'
  workflow_dispatch: {}

permissions:
  id-token: write   # required for AWS OIDC — no long-lived AWS keys stored in GitHub
  contents: read

env:
  ECR_REPOSITORY: properly-backend

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-django
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend-django/requirements/dev.txt

      - run: pip install -r requirements/dev.txt

      # Sanity check only — no real DB/secrets needed for `check`, just enough
      # to prove the settings module and app registry load without errors.
      - run: DJANGO_SECRET_KEY=ci-placeholder python manage.py check
        env:
          DJANGO_SETTINGS_MODULE: config.settings.dev

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-django
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" -t "$ECR_REGISTRY/$ECR_REPOSITORY:latest" .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"

      - name: Trigger App Runner deployment
        run: |
          aws apprunner start-deployment --service-arn "${{ secrets.BACKEND_APPRUNNER_SERVICE_ARN }}"
